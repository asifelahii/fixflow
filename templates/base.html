{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}FixFlow{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'repairs/css/style.css' %}"
    >
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="site-header">
        <nav
            class="navbar navbar-dark"
            aria-label="Primary navigation"
        >
            <div class="container ff-container">
                <a
                    class="navbar-brand fw-semibold"
                    href="{% url 'repairs:home' %}"
                >
                    FixFlow
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        <div class="container ff-container py-4 py-md-5">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="border-top bg-white py-4">
        <div class="container ff-container">
            <p class="mb-0 text-body-secondary small text-center">
                FixFlow repair tracking
            </p>
        </div>
    </footer>

</body>
</html>
